{
  "name": "iOS build and complete XCTest acceptance",
  "on": [
    "push",
    "workflow_dispatch"
  ],
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "ios-${{ github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "simulator": {
      "if": "${{ github.event.repository.private == false }}",
      "runs-on": "macos-15",
      "timeout-minutes": 30,
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Build every target and run all unit and UI tests",
          "run": "python3 tools/run_native_ci.py --simulator-signing --external-input-qa"
        },
        {
          "name": "Build Release for iOS Simulator",
          "run": "python3 tools/build_mac.py --scope build --configuration Release --simulator-signing"
        },
        {
          "name": "Verify separate Release build evidence",
          "if": "always()",
          "run": "python3 tools/verify_release_result.py"
        },
        {
          "name": "Require all 86 tests once, no failures or skips, no compiler warnings",
          "if": "always()",
          "run": "python3 tools/verify_native_result.py --expected-unit 76 --expected-ui 10 --require-no-compiler-warnings"
        },
        {
          "name": "Verify Japanese bundles and extracted App Intent metadata",
          "if": "always()",
          "run": "python3 tools/check_shortcut_metadata.py"
        },
        {
          "name": "Export synthetic-test screenshots",
          "if": "always()",
          "run": "python3 tools/export_ui_attachments.py"
        },
        {
          "name": "Collect bounded review evidence",
          "if": "always()",
          "run": "python3 - <<'PY'\nimport hashlib, json, pathlib, re\nroot = pathlib.Path.cwd()\nsource = root / 'artifacts'\ndestination = root / 'ci-evidence'\ndestination.mkdir()\nlimit = 20 * 1024 * 1024 - 64 * 1024\ntotal = 0\nrecords = []\ncredentials = re.compile(rb'gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-(?:proj-)?[A-Za-z0-9_-]{20,}|-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----')\npaths = sorted(source.glob('*.json')) + sorted(source.glob('*.xml')) + sorted(source.glob('*.log'))\npaths += sorted(source.glob('UI-*/**/*.png'))\npaths += sorted(source.glob('UI-*/**/*.json'))\npaths += sorted(source.glob('fixture-setup-failure.png'))\nfor path in paths:\n    if path.is_symlink() or not path.is_file() or not path.resolve().is_relative_to(source.resolve()):\n        raise ValueError('Unsafe evidence path')\n    relative = path.relative_to(source)\n    size = path.stat().st_size\n    if path.suffix == '.log' and size > 1024 * 1024:\n        with path.open('rb') as file:\n            data = file.read(512 * 1024)\n            file.seek(-512 * 1024, 2)\n            data += b'\\n[Review copy truncated; full log is on the workflow run page]\\n' + file.read(512 * 1024)\n    elif size > 5 * 1024 * 1024:\n        records.append({'path': str(relative), 'copied': False, 'reason': 'per-file size limit', 'source_bytes': size})\n        continue\n    else:\n        data = path.read_bytes()\n    if credentials.search(data):\n        raise ValueError('Credential pattern detected; evidence is not uploaded')\n    if total + len(data) > limit:\n        records.append({'path': str(relative), 'copied': False, 'reason': 'archive size limit', 'source_bytes': size})\n        continue\n    target = destination / relative\n    target.parent.mkdir(parents=True, exist_ok=True)\n    target.write_bytes(data)\n    total += len(data)\n    records.append({'path': str(relative), 'copied': True, 'source_bytes': size, 'copy_bytes': len(data), 'truncated': size != len(data), 'sha256': hashlib.sha256(data).hexdigest()})\nreport = json.dumps({'copy_bytes': total, 'limit_bytes': limit, 'records': records}, indent=2).encode('utf-8')\nif len(report) > 64 * 1024:\n    raise ValueError('Evidence index exceeded its reserved size')\n(destination / 'review-copy.json').write_bytes(report)\nprint('Bounded evidence copy bytes:', total)\nPY\n"
        },
        {
          "name": "Preserve actual build and synthetic test evidence",
          "if": "always()",
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "ios-test-evidence",
            "path": "ci-evidence/",
            "retention-days": 1
          }
        }
      ],
      "env": {
        "DEVELOPER_DIR": "/Applications/Xcode_26.3.app/Contents/Developer",
        "ATODE_QA_IOS_RUNTIME": "18.5"
      }
    },
    "iphone-archive": {
      "name": "Unsigned Release iPhone archive",
      "needs": [
        "simulator"
      ],
      "if": "${{ github.event.repository.private == false }}",
      "runs-on": "macos-15",
      "timeout-minutes": 20,
      "env": {
        "DEVELOPER_DIR": "/Applications/Xcode_26.3.app/Contents/Developer"
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Build and verify unsigned iPhone products without a Developer account",
          "run": "python3 tools/build_unsigned_device.py"
        },
        {
          "name": "Collect bounded unsigned build evidence",
          "if": "always()",
          "run": "python3 - <<'PY'\nimport hashlib, json, pathlib, re\nroot = pathlib.Path.cwd()\nsource = root / 'artifacts'\ndestination = root / 'ci-device-evidence'\ndestination.mkdir()\nlimit = 20 * 1024 * 1024 - 64 * 1024\ntotal = 0\nrecords = []\ncredentials = re.compile(rb'gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-(?:proj-)?[A-Za-z0-9_-]{20,}|-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----')\npaths = sorted(source.glob('*.json')) + sorted(source.glob('*.xml')) + sorted(source.glob('*.log'))\npaths += sorted(source.glob('UI-*/**/*.png'))\npaths += sorted(source.glob('UI-*/**/*.json'))\npaths += sorted(source.glob('fixture-setup-failure.png'))\nfor path in paths:\n    if path.is_symlink() or not path.is_file() or not path.resolve().is_relative_to(source.resolve()):\n        raise ValueError('Unsafe evidence path')\n    relative = path.relative_to(source)\n    size = path.stat().st_size\n    if path.suffix == '.log' and size > 1024 * 1024:\n        with path.open('rb') as file:\n            data = file.read(512 * 1024)\n            file.seek(-512 * 1024, 2)\n            data += b'\\n[Review copy truncated; full log is on the workflow run page]\\n' + file.read(512 * 1024)\n    elif size > 5 * 1024 * 1024:\n        records.append({'path': str(relative), 'copied': False, 'reason': 'per-file size limit', 'source_bytes': size})\n        continue\n    else:\n        data = path.read_bytes()\n    if credentials.search(data):\n        raise ValueError('Credential pattern detected; evidence is not uploaded')\n    if total + len(data) > limit:\n        records.append({'path': str(relative), 'copied': False, 'reason': 'archive size limit', 'source_bytes': size})\n        continue\n    target = destination / relative\n    target.parent.mkdir(parents=True, exist_ok=True)\n    target.write_bytes(data)\n    total += len(data)\n    records.append({'path': str(relative), 'copied': True, 'source_bytes': size, 'copy_bytes': len(data), 'truncated': size != len(data), 'sha256': hashlib.sha256(data).hexdigest()})\nreport = json.dumps({'copy_bytes': total, 'limit_bytes': limit, 'records': records}, indent=2).encode('utf-8')\nif len(report) > 64 * 1024:\n    raise ValueError('Evidence index exceeded its reserved size')\n(destination / 'review-copy.json').write_bytes(report)\nprint('Bounded evidence copy bytes:', total)\nPY\n"
        },
        {
          "name": "Preserve unsigned build evidence, excluding all application binaries",
          "if": "always()",
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "unsigned-iphone-evidence",
            "path": "ci-device-evidence/",
            "retention-days": 1
          }
        }
      ]
    }
  }
}
