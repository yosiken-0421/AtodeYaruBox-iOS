{
  "name": "Read approved Codemagic app metadata",
  "on": {"workflow_dispatch": {}},
  "permissions": {"contents": "read"},
  "concurrency": {"group": "codemagic-read-access", "cancel-in-progress": false},
  "jobs": {
    "read": {
      "if": "${{ github.event.repository.private == false && github.repository == 'yosiken-0421/AtodeYaruBox-iOS' && github.ref == 'refs/heads/main' }}",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 3,
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {"persist-credentials": false}
        },
        {
          "name": "Check request scope, redirects and secret-safe reporting",
          "run": "python3 -m unittest tools.tests.test_codemagic_read_access -v"
        },
        {
          "name": "Read only the existing approved application's metadata",
          "env": {"CODEMAGIC_API_TOKEN": "${{ secrets.CODEMAGIC_API_TOKEN }}"},
          "run": "python3 tools/codemagic_read_access.py"
        },
        {
          "name": "Show sanitized access result",
          "if": "always()",
          "run": "python3 -c \"from pathlib import Path; p=Path('artifacts/codemagic-read-access.json'); print(p.read_text() if p.exists() else 'NO_ACCESS_REPORT')\""
        }
      ]
    }
  }
}
