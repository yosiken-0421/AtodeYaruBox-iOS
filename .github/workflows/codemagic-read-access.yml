{
  "name": "Read approved Codemagic app metadata",
  "on": {"workflow_dispatch": {"inputs": {"mode": {"type": "choice", "default": "app", "options": ["app", "integration"]}}}},
  "permissions": {"contents": "read"},
  "concurrency": {"group": "codemagic-read-access", "cancel-in-progress": false},
  "jobs": {
    "read": {
      "if": "${{ github.event.repository.private == false && github.repository == 'yosiken-0421/AtodeYaruBox-iOS' && github.ref == 'refs/heads/main' }}",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 3,
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {"persist-credentials": false}
        },
        {
          "name": "Check request scope, redirects and secret-safe reporting",
          "run": "python3 -m unittest tools.tests.test_codemagic_read_access tools.tests.test_codemagic_integration_read -v"
        },
        {
          "name": "Read only the existing approved application's metadata",
          "if": "${{ inputs.mode == 'app' }}",
          "env": {"CODEMAGIC_API_TOKEN": "${{ secrets.CODEMAGIC_API_TOKEN }}"},
          "run": "python3 tools/codemagic_read_access.py"
        },
        {
          "name": "Compare only the approved app's owner context and saved Apple alias",
          "if": "${{ inputs.mode == 'integration' }}",
          "env": {"CODEMAGIC_API_TOKEN": "${{ secrets.CODEMAGIC_API_TOKEN }}"},
          "run": "python3 -m tools.codemagic_integration_read"
        },
        {
          "name": "Show sanitized access result",
          "if": "always()",
          "run": "python3 -c \"from pathlib import Path; [print(p.read_text()) for p in (Path('artifacts/codemagic-read-access.json'), Path('artifacts/codemagic-integration-read.json')) if p.exists()]\""
        }
      ]
    }
  }
}
